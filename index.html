<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#131B23">
<title>Upper/Lower Tracker</title>
<!--
=====================================================================
  UPPER/LOWER TRAINING TRACKER  v2  (single file, no build, no backend)
=====================================================================
  HOW TO USE
  1. Replace the old file with this one IN THE SAME FOLDER, with the
     same name, and open it in the same browser. Your logged data is
     tied to the browser and file location, and is migrated
     automatically on first open (schema 1 -> 2, nothing is deleted).
  2. Today tab: pick a day (or a saved template) and press Start.
     Log kg/lb, reps and RIR per set, tap the check mark when done.
     - Tap the set number to switch working set <-> warm-up (W).
     - "Ramp-up" adds 40/60/80/90% warm-up sets from today's weight.
     - "Plates" shows the plates per side for the top set.
     - "Photo" attaches one photo to the exercise for this session.
     - Rest presets (60/90/120/180 s) sit under the session title.
  3. Tools (on the Today tab): plate calculator, RPE <-> RIR converter,
     rest timer presets. The kg/lb button in the top bar switches
     units everywhere.
  4. Program tab: edit exercises, save a day as a template, load a
     template into a day.
  5. Progress tab: charts, PRs, weekly sets per muscle, push/pull
     balance, streak, history.
  6. Settings tab: block start/week, rest, units and increments,
     export/import JSON, reset program, clear logs.

  DATA
  localStorage (prefix "ut_tracker_v1_"): program, sessions, settings,
  templates, meta. Photos live in IndexedDB "ut_tracker_v1_photos"
  and are NOT included in the JSON export.

  OFFLINE
  No external resources. Works from file:// without a connection.
=====================================================================
-->
<style>
:root{
  --bg:#131B23;
  --surface:#1B2632;
  --surface-2:#243341;
  --line:#33475A;
  --text:#ECE8E0;
  --muted:#98A6B4;
  --yellow:#F2C335;   /* 15 kg plate: primary actions, progression */
  --red:#E2553F;      /* 25 kg plate: PRs, warnings */
  --green:#4DB57A;    /* 10 kg plate: completed sets */
  --blue:#4C8FE0;     /* 20 kg plate: warm-ups */
  --radius-l:14px;
  --radius-s:8px;
  --font-display:"Bahnschrift","DIN Alternate","DIN Condensed","Roboto Condensed","Arial Narrow",system-ui,sans-serif;
  --font-body:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-body);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
body{padding-bottom:calc(72px + env(safe-area-inset-bottom,0px))}
body.timer-on{padding-bottom:calc(136px + env(safe-area-inset-bottom,0px))}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}

.topbar{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);
  padding:calc(8px + env(safe-area-inset-top,0px)) 12px 8px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{font-family:var(--font-display);font-size:1.35rem;font-weight:700;margin:0;letter-spacing:.01em}
.top-right{display:flex;align-items:center;gap:10px}
.weekpill{font-family:var(--font-display);font-size:1rem;color:var(--muted);white-space:nowrap}
.weekpill b{color:var(--yellow);font-weight:700}
.unit-btn{min-height:44px;min-width:56px;border-radius:var(--radius-s);border:1px solid var(--line);background:var(--surface-2);font-family:var(--font-display);font-weight:700;font-size:1.05rem}

main{max-width:760px;margin:0 auto;padding:16px}
h2{font-family:var(--font-display);font-size:1.7rem;line-height:1.1;margin:4px 0 10px}
h3{font-family:var(--font-display);font-size:1.2rem;line-height:1.2;margin:0}
p{margin:0 0 10px}
.muted{color:var(--muted)}
.small{font-size:.88rem}
.num{font-variant-numeric:tabular-nums}

button{font:inherit;color:inherit;cursor:pointer}
button:disabled{opacity:.45;cursor:not-allowed}
.btn{min-height:48px;padding:0 18px;border-radius:var(--radius-s);border:1px solid var(--line);background:var(--surface-2);font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none}
.btn.primary{background:var(--yellow);border-color:var(--yellow);color:#1C1604}
.btn.danger{background:transparent;border-color:var(--red);color:var(--red)}
.btn.ghost{background:transparent}
.btn.block{width:100%}
.btn.small{min-height:44px;padding:0 12px;font-size:.92rem}
.stack>*+*{margin-top:10px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{min-height:44px;min-width:56px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface-2);font-weight:600;font-variant-numeric:tabular-nums}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--radius-s);overflow:hidden}
.seg button{min-height:44px;min-width:56px;border:0;background:transparent;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--yellow);color:#1C1604}

input,select,textarea{font:inherit;font-size:16px;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:var(--radius-s);min-height:48px;padding:0 10px;width:100%}
textarea{padding:10px;min-height:84px;resize:vertical}
input::placeholder,textarea::placeholder{color:#62788C}
.field{display:block;margin-bottom:12px}
.field>span{display:block;font-size:.88rem;color:var(--muted);margin-bottom:4px}
.check-field{display:flex;align-items:center;gap:12px;min-height:48px;margin-bottom:8px}
.check-field input{width:24px;height:24px;min-height:0;accent-color:var(--yellow)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:0 8px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-l);padding:14px;margin-bottom:14px}
.callout{border-left:3px solid var(--yellow);background:var(--surface);padding:10px 12px;border-radius:0 var(--radius-s) var(--radius-s) 0;margin:0 0 14px}
.callout.good{border-color:var(--green)}
.callout.warn{border-color:var(--red)}
.empty{padding:18px;border:1px dashed var(--line);border-radius:var(--radius-l);margin-bottom:16px}
.empty h3{margin-bottom:6px}

/* Adherence strip */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-s);padding:10px 12px}
.stat b{display:block;font-family:var(--font-display);font-size:1.7rem;line-height:1;font-variant-numeric:tabular-nums}
.stat span{font-size:.82rem;color:var(--muted)}

/* Tools */
details.tools{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-l);margin:0 0 16px}
details.tools>summary{min-height:52px;padding:0 14px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;font-family:var(--font-display);font-size:1.15rem;font-weight:700;list-style:none}
details.tools>summary::-webkit-details-marker{display:none}
details.tools>summary::after{content:"+";font-size:1.4rem;color:var(--muted)}
details.tools[open]>summary::after{content:"−"}
.tools-body{padding:0 14px 14px}
.tool{padding:12px 0;border-top:1px solid var(--line)}
.tool h4{margin:0 0 8px;font-size:1rem}
.tool-row{display:flex;gap:8px;align-items:center}
.tool-row .field{flex:1;margin:0}
.plates-out{margin-top:10px}
.plate-list{display:flex;gap:4px;align-items:center;flex-wrap:wrap;margin-top:6px}
.plate{display:inline-flex;align-items:center;justify-content:center;min-width:40px;height:40px;padding:0 6px;border-radius:6px;font-weight:700;font-size:.9rem;font-variant-numeric:tabular-nums;border:1px solid var(--line);background:var(--surface-2)}
.plate.p25,.plate.p45{background:#C7392B;color:#fff;height:52px}
.plate.p20,.plate.p35{background:#2F6FBF;color:#fff;height:48px}
.plate.p15,.plate.p25lb{background:#D9A91E;color:#1C1604;height:44px}
.plate.p10{background:#2F8F58;color:#fff}
.plate.bar{background:transparent;border-style:dashed;color:var(--muted)}

/* Today: day picker */
.day-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.day-btn{text-align:left;padding:12px 14px;min-height:88px;border-radius:var(--radius-l);border:1px solid var(--line);background:var(--surface)}
.day-btn[aria-pressed="true"]{border-color:var(--yellow);box-shadow:inset 0 0 0 1px var(--yellow)}
.day-btn .dname{display:block;font-family:var(--font-display);font-size:1.3rem;font-weight:700}
.day-btn .dmeta{display:block;font-size:.85rem;color:var(--muted)}
.day-btn .next{display:block;font-size:.82rem;color:var(--yellow);margin-top:2px}
.preview{list-style:none;margin:0 0 16px;padding:0}
.preview li{padding:10px 0;border-bottom:1px solid var(--line)}
.preview li:last-child{border-bottom:0}
.tpl-list{list-style:none;margin:0;padding:0}
.tpl-list li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.tpl-list li:last-child{border-bottom:0}

/* Active session */
.sess-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:8px}
.sess-clock{font-family:var(--font-display);font-size:1.6rem;font-weight:700;font-variant-numeric:tabular-nums;text-align:right;line-height:1}
.sess-clock small{display:block;font-family:var(--font-body);font-size:.75rem;font-weight:400;color:var(--muted)}
.rest-row{display:flex;align-items:center;gap:8px;margin:0 0 14px;flex-wrap:wrap}
.rest-row>span{font-size:.88rem;color:var(--muted)}
.ex{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-l);padding:14px;margin-bottom:14px}
.ex-title{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tag{display:inline-flex;align-items:center;justify-content:center;min-width:24px;height:24px;border:1px solid var(--muted);border-radius:6px;font-size:.78rem;font-weight:700;color:var(--muted)}
.ss{font-size:.8rem;color:var(--blue);border:1px solid var(--blue);border-radius:6px;padding:1px 6px}
.target{margin:6px 0 0;font-variant-numeric:tabular-nums}
.next-target{margin:8px 0 0;font-family:var(--font-display);font-size:1.15rem;font-weight:700;font-variant-numeric:tabular-nums}
.next-target.up{color:var(--yellow)}
.next-target.up::before{content:"\25B2  "}
.next-target.down{color:var(--red)}
.next-target.down::before{content:"\25BC  "}
.hint{margin:2px 0 0;font-size:.9rem;color:var(--muted)}
.e1{margin:4px 0 0;font-size:.9rem;font-variant-numeric:tabular-nums}
.e1 .tr-up{color:var(--green)}
.e1 .tr-down{color:var(--red)}
.e1 .tr-flat{color:var(--muted)}
.last{margin:2px 0 0;font-size:.9rem;color:var(--muted)}
.technique,.warn-line{margin:6px 0 0;font-size:.9rem;color:var(--red)}
.warn-line{font-weight:600}
.ex-notes{margin:6px 0 0;font-size:.88rem;color:var(--muted)}
.sets{margin-top:12px}
.set-head,.set-row{display:grid;grid-template-columns:46px minmax(0,1fr) minmax(0,1fr) minmax(0,.8fr) 50px 34px;gap:6px;align-items:center}
.set-head{font-size:.78rem;color:var(--muted);padding-bottom:4px;text-align:center}
.set-row{margin-bottom:6px;border-radius:var(--radius-s)}
.set-row input{text-align:center;font-variant-numeric:tabular-nums;font-size:1.1rem;padding:0 4px}
.set-type{height:48px;border-radius:var(--radius-s);border:1px solid var(--line);background:var(--surface-2);font-family:var(--font-display);font-weight:700;font-size:1.05rem}
.set-row.warm .set-type{background:transparent;color:var(--blue);border-color:var(--blue)}
.set-row.warm input{border-style:dashed}
.set-row.is-pr .set-type{background:var(--red);border-color:var(--red);color:#fff}
.set-row.pr-flash{animation:prflash 1.2s ease-out}
@keyframes prflash{0%{box-shadow:0 0 0 0 rgba(226,85,63,.9);background:rgba(226,85,63,.35)}100%{box-shadow:0 0 0 14px rgba(226,85,63,0);background:transparent}}
.check{height:48px;border-radius:var(--radius-s);border:2px solid var(--line);background:transparent;font-size:1.3rem;color:var(--muted)}
.set-row.done .check{background:var(--green);border-color:var(--green);color:#07160D}
.set-row.done input{border-color:rgba(77,181,122,.5)}
.del{height:48px;background:none;border:0;color:var(--muted);font-size:1.35rem;padding:0}
.ex-actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:6px 0 8px}
.ex-inline{background:var(--surface-2);border-radius:var(--radius-s);padding:10px 12px;margin:0 0 10px;font-size:.92rem}
.photo-wrap{display:flex;gap:10px;align-items:flex-start;margin:0 0 10px}
.thumb{width:72px;height:72px;object-fit:cover;border-radius:var(--radius-s);border:1px solid var(--line);background:var(--surface-2);cursor:zoom-in}
.thumb.big{width:100%;height:auto;max-height:70vh;object-fit:contain;cursor:zoom-out}
.photo-wrap.big{flex-direction:column}
.pr-legend{font-size:.8rem;color:var(--muted);margin:0 0 10px}
.pr-legend i{display:inline-block;width:10px;height:10px;border-radius:2px;background:var(--red);margin-right:4px;vertical-align:0}

/* Program */
.day-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:6px}
.day-head .chips{justify-content:flex-end}
.prog-list{list-style:none;margin:0 0 12px;padding:0}
.prog-list li{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line)}
.prog-main{min-width:0}
.prog-btns{display:flex;gap:4px;flex-shrink:0}
.icon{width:44px;height:44px;border-radius:var(--radius-s);border:1px solid var(--line);background:var(--surface-2);font-size:1.1rem}

/* Progress */
.pr-cards{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.pr-card{background:var(--surface-2);border-radius:var(--radius-s);padding:10px 12px}
.pr-card .v{font-family:var(--font-display);font-size:1.6rem;font-weight:700;color:var(--red);font-variant-numeric:tabular-nums;line-height:1.1}
.pr-card .l{font-size:.85rem;color:var(--muted)}
canvas{display:block;width:100%}
.legend{display:flex;gap:16px;font-size:.85rem;color:var(--muted);margin:6px 0 10px}
.legend span::before{content:"";display:inline-block;width:18px;height:3px;margin-right:6px;vertical-align:middle;background:var(--yellow)}
.legend span.e1l::before{background:repeating-linear-gradient(90deg,var(--muted) 0 5px,transparent 5px 9px)}
table{width:100%;border-collapse:collapse;font-size:.92rem;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-weight:500}
.week-nav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.balance{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:12px 0 8px}
.balance .stat b{font-size:1.5rem}
details.hist{border-bottom:1px solid var(--line);padding:6px 0}
details.hist summary{cursor:pointer;min-height:44px;display:flex;align-items:center;justify-content:space-between;gap:10px}
details.hist ul{margin:4px 0 10px;padding-left:18px;font-size:.9rem;color:var(--muted)}
.hist-photos{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px}

/* Bottom tabs */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:10;display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar button{min-height:64px;background:none;border:0;color:var(--muted);font-family:var(--font-display);font-size:1.05rem;font-weight:600}
.tabbar button[aria-selected="true"]{color:var(--text);box-shadow:inset 0 3px 0 var(--yellow)}

/* Rest timer */
.timer{position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom,0px));z-index:9;display:none;align-items:center;gap:8px;padding:10px 12px;background:var(--surface-2);border-top:1px solid var(--line)}
.timer.on{display:flex}
.timer-track{position:absolute;left:0;right:0;top:0;height:3px;background:var(--line)}
.timer-fill{height:100%;width:0;background:var(--yellow)}
.timer-time{font-family:var(--font-display);font-size:1.9rem;font-weight:700;font-variant-numeric:tabular-nums;min-width:4.2ch}
.timer-label{flex:1;font-size:.9rem;color:var(--muted)}
.timer .btn{min-height:44px;padding:0 12px}
.timer.finished{background:var(--green);color:#07160D}
.timer.finished .timer-label{color:#07160D;font-weight:600}

.toast{position:fixed;left:50%;top:calc(64px + env(safe-area-inset-top,0px));transform:translate(-50%,-8px);z-index:20;background:var(--text);color:var(--bg);padding:10px 16px;border-radius:var(--radius-s);font-weight:600;max-width:calc(100vw - 32px);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.pr{background:var(--red);color:#fff}

dialog{background:var(--surface);color:var(--text);border:1px solid var(--line);border-radius:var(--radius-l);padding:0;width:min(560px,calc(100vw - 20px));max-height:calc(100dvh - 20px)}
dialog::backdrop{background:rgba(6,10,14,.72)}
.dlg{padding:16px;overflow:auto;max-height:calc(100dvh - 22px)}
.dlg h3{margin-bottom:12px}
.dlg-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.dlg-actions .btn{flex:1}
fieldset{border:0;padding:0;margin:0 0 4px}
legend{font-size:.88rem;color:var(--muted);margin-bottom:4px;padding:0}

@media (min-width:640px){ .day-grid{grid-template-columns:repeat(4,1fr)} }
@media (prefers-reduced-motion:reduce){ .toast{transition:none} .set-row.pr-flash{animation:none} }
</style>
</head>
<body>

<header class="topbar">
  <h1 class="brand">Upper/Lower</h1>
  <div class="top-right">
    <span class="weekpill" id="weekpill"></span>
    <button type="button" class="unit-btn" id="unit-btn"></button>
  </div>
</header>

<main id="view" role="tabpanel" tabindex="-1"></main>

<div class="timer" id="timer" role="timer" aria-label="Rest timer">
  <div class="timer-track"><div class="timer-fill" id="timer-fill"></div></div>
  <span class="timer-time" id="timer-time">1:30</span>
  <span class="timer-label" id="timer-label">Resting</span>
  <button type="button" class="btn" data-t="minus" aria-label="Remove 15 seconds">−15</button>
  <button type="button" class="btn" data-t="plus" aria-label="Add 15 seconds">+15</button>
  <button type="button" class="btn" data-t="stop">Skip</button>
</div>

<nav class="tabbar" role="tablist" aria-label="Sections">
  <button type="button" role="tab" data-tab="today" aria-controls="view">Today</button>
  <button type="button" role="tab" data-tab="program" aria-controls="view">Program</button>
  <button type="button" role="tab" data-tab="progress" aria-controls="view">Progress</button>
  <button type="button" role="tab" data-tab="settings" aria-controls="view">Settings</button>
</nav>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="sr-only" id="live" aria-live="assertive"></div>
<input type="file" id="import-file" accept="application/json,.json" class="sr-only" tabindex="-1" aria-hidden="true">
<input type="file" id="photo-file" accept="image/*" class="sr-only" tabindex="-1" aria-hidden="true">

<!-- Exercise editor -->
<dialog id="ex-dialog" aria-labelledby="ex-dlg-title">
  <form class="dlg" id="ex-form" novalidate>
    <h3 id="ex-dlg-title">Edit exercise</h3>
    <label class="field"><span>Name</span><input name="name" required maxlength="80"></label>
    <div class="grid2">
      <label class="field"><span>Type</span>
        <select name="type"><option value="C">Compound</option><option value="A">Accessory / isolation</option></select></label>
      <label class="field"><span>Muscle group (for volume)</span><select name="muscle"></select></label>
      <label class="field"><span>Push / pull balance</span>
        <select name="pattern"><option value="push">Push</option><option value="pull">Pull</option><option value="none">Neither</option></select></label>
      <label class="field"><span>Rest (seconds)</span><input name="rest" inputmode="numeric"></label>
      <label class="field"><span>Sets, weeks 1–2</span><input name="sets" inputmode="numeric"></label>
      <label class="field"><span>Sets, weeks 3–4</span><input name="setsW34" inputmode="numeric"></label>
      <label class="field"><span>Reps, bottom of range</span><input name="repMin" inputmode="numeric"></label>
      <label class="field"><span>Reps, top of range</span><input name="repMax" inputmode="numeric"></label>
    </div>
    <fieldset>
      <legend>Target RIR per week</legend>
      <div class="grid4">
        <label class="field"><span>Wk 1</span><input name="rir0" inputmode="numeric"></label>
        <label class="field"><span>Wk 2</span><input name="rir1" inputmode="numeric"></label>
        <label class="field"><span>Wk 3</span><input name="rir2" inputmode="numeric"></label>
        <label class="field"><span>Wk 4</span><input name="rir3" inputmode="numeric"></label>
      </div>
    </fieldset>
    <div class="grid2">
      <label class="field"><span>Load step in kg (blank = default)</span><input name="increment" inputmode="decimal"></label>
      <label class="field"><span>Superset tag (e.g. 7a)</span><input name="superset" maxlength="6"></label>
    </div>

function fmtRest(s) { s = Math.max(0, Math.round(s)); return Math.floor(s / 60) + ':' + pad2(s % 60); }

function defaultSettings() {

    incUpper: 2.5, incLower: 5, incUpperLb: 5, incLowerLb: 10, unit: 'kg', sound: true };
}
function normalizeEx(e) {
  var o = Object.assign({ type: 'A', name: 'Exercise', muscle: 'Chest', sets: 3, repMin: 8, repMax: 12, rirWeeks: [2,2,1,1], rest: 90,
    increment: null, superset: '', perSide: false, bodyweight: false, technique: '', notes: '' }, e || {});

function validProgram(p) {
  return p && Array.isArray(p.days) && p.days.length > 0 && p.days.every(function (d) { return d && d.id && Array.isArray(d.exercises); });
}

/* ================= State ================= */
var program = load(K.program, null);
if (!validProgram(program)) { program = defaultProgram(); save(K.program, program); }
program.days.forEach(function (d) { d.exercises = d.exercises.map(normalizeEx); });
var sessions = load(K.sessions, []);
if (!Array.isArray(sessions)) sessions = [];

var storedSettings = load(K.settings, null);
var settings = Object.assign(defaultSettings(), storedSettings || {});
var templates = load(K.templates, []);
if (!Array.isArray(templates)) templates = [];

var ui = { tab: 'today', selectedDay: null, progressEx: null, volWeek: null, justCompleted: null, chart: null,
  toolsOpen: false, plateW: '', plateUnit: null, rpe: '', rir: '', platesOpen: {}, photoBig: {}, photoFor: null };

function saveProgram() { save(K.program, program); }
function saveSessions() { save(K.sessions, sessions); }
function saveSettings() { save(K.settings, settings); }
function saveTemplates() { save(K.templates, templates); }
var saveT = null;
function saveSessionsSoon() { clearTimeout(saveT); saveT = setTimeout(function () { saveT = null; saveSessions(); }, 250); }
function flush() { if (saveT) { clearTimeout(saveT); saveT = null; saveSessions(); } }
window.addEventListener('pagehide', flush);

/* ================= Migration (schema 1 -> 2) =================
   Schema 1 = the first version of this app (no meta key).
   Changes are ADDITIVE ONLY, nothing is removed or renamed:
   - program exercises gain `pattern` ('push' | 'pull' | 'none')
   - session entries gain `pattern` (snapshot, same values)
   - settings gain `unit`, `incUpperLb`, `incLowerLb`
   - new keys: templates, meta                                          */
function migrate(force) {
  var meta = load(K.meta, null) || { schema: 1 };
  if (!force && meta.schema >= SCHEMA) return false;
  program.days.forEach(function (d) { d.exercises = d.exercises.map(normalizeEx); });
  sessions.forEach(function (s) {
    s.entries.forEach(function (en) {
      if (['push','pull','none'].indexOf(en.pattern) < 0) {
        var f = findEx(en.exId);
        en.pattern = f ? f.ex.pattern : defaultPattern(en.muscle, en.name);
      }
    });
  });
  settings = Object.assign(defaultSettings(), settings);
  saveProgram(); saveSessions(); saveSettings(); saveTemplates();
  save(K.meta, { schema: SCHEMA, migratedAt: new Date().toISOString(), from: meta.schema });
  return true;
}

/* ================= Domain logic ================= */
function currentWeek() {
  if (settings.weekMode === 'manual') return clamp(Number(settings.manualWeek) || 1, 1, 5);
  var days = daysBetween(settings.programStart, isoDate());
  return clamp(Math.floor(days / 7) + 1, 1, 5);
}
function findDay(id) { return program.days.find(function (d) { return d.id === id; }) || null; }
function findEx(exId) {
  for (var i = 0; i < program.days.length; i++) {
    var d = program.days[i], e = d.exercises.find(function (x) { return x.id === exId; });
    if (e) return { day: d, ex: e };
  }
  return null;
}
function activeSession() { return sessions.find(function (s) { return !s.completedAt; }) || null; }
function completedSessions() {
  return sessions.filter(function (s) { return s.completedAt; }).sort(function (a, b) {
    return a.date < b.date ? -1 : a.date > b.date ? 1 : a.startedAt - b.startedAt;
  });
}
function lastEntries(exId, n, excludeId) {
  var out = [], comp = completedSessions();
  for (var i = comp.length - 1; i >= 0 && out.length < n; i--) {
    if (comp[i].id === excludeId) continue;
    var en = comp[i].entries.find(function (e) { return e.exId === exId; });
    if (en && en.sets.some(isWork)) out.push({ entry: en, session: comp[i] });
  }
  return out;
}
function lastEntry(exId, excludeId) { return lastEntries(exId, 1, excludeId)[0] || null; }
function topW(entry) { return maxOf(entry.sets.filter(isWork).map(function (x) { return x.w || 0; })); }
function bestE(entry) { return maxOf(entry.sets.filter(isWork).map(function (x) { return e1rm(x.w, x.r); })); }
function target(e, week) {
  if (week >= 5) return { sets: Math.max(1, Math.ceil(e.sets / 2)), rir: 4, deload: true };
  return { sets: week >= 3 ? e.setsW34 : e.sets, rir: e.rirWeeks[week - 1], deload: false };
}
function rangeTxt(min, max, perSide) { return min + '–' + max + (perSide ? '/side' : ''); }
function patternOf(en) {
  if (['push','pull','none'].indexOf(en.pattern) > -1) return en.pattern;
  var f = findEx(en.exId); return f ? f.ex.pattern : defaultPattern(en.muscle, en.name);
}

/* Load step in DISPLAY units. Per-exercise override is stored in kg. */
function incD(p, region) {
  if (p.increment != null && p.increment !== '') {
    var k = Number(p.increment);
    return U() === 'lb' ? Math.max(2.5, roundTo(k * LB, 2.5)) : k;
  }
  if (U() === 'lb') return Number(region === 'upper' ? settings.incUpperLb : settings.incLowerLb);
  return Number(region === 'upper' ? settings.incUpper : settings.incLower);
}

/* ---------- Auto-progression engine ----------
   p = { id, repMin, repMax, perSide, bodyweight, increment, rir (today's target), deload }
   Returns { kind: new|up|hold|down|deload, weight (kg or null), reps, why }            */
function progression(p, region, excludeId) {
  var range = rangeTxt(p.repMin, p.repMax, p.perSide), step = roundStepD();
  var L = lastEntries(p.id, 2, excludeId);
  if (!L.length) return { kind: 'new', weight: null, reps: null, why: 'First time: find a load for ' + range + ' reps at RIR ' + p.rir + '.' };
  var prev = L[0].entry, work = prev.sets.filter(isWork);
  var top = topW(prev), topD = toD(top);
  var repsList = work.map(function (s) { return s.r; }).join(', ');
  var minR = minOf(work.map(function (s) { return s.r; }));
  if (p.deload) {
    return { kind: 'deload', weight: top > 0 ? fromD(roundTo(topD * 0.9, step)) : 0, reps: p.repMin,
      why: 'Deload week: about 10% lighter, half the sets, RIR 4.' };
  }
  var repsTop = work.every(function (s) { return s.r >= prev.repMax; });
  var logged = work.filter(function (s) { return s.rir != null; }).map(function (s) { return s.rir; });
  var gap = logged.length ? minOf(logged) - prev.targetRir : 0; // negative = harder than planned
  if (repsTop && gap >= -1) {
    if (top === 0) return { kind: 'up', weight: 0, reps: p.repMin, why: 'Top of range hit (' + repsList + '). Add load or a harder variation.' };
    var upStep = U() === 'lb' ? 2.5 : 0.5;
    var nextD = Math.ceil((topD + incD(p, region)) / upStep - 1e-6) * upStep;
    return { kind: 'up', weight: fromD(nextD), reps: p.repMin,
      why: 'Top of range hit on every set (' + repsList + '). Add load, reps restart at ' + p.repMin + '.' };
  }
  if (repsTop) {
    return { kind: 'hold', weight: top, reps: prev.repMax,
      why: 'Top reps hit, but ' + (-gap) + ' reps closer to failure than the RIR ' + prev.targetRir + ' target. Repeat with more in reserve.' };
  }
  var below = prev.repMin - minR;
  var prevE = L[1] ? L[1].entry : null;
  var prevBelow = prevE && topW(prevE) >= top && prevE.sets.filter(isWork).some(function (s) { return s.r < prevE.repMin; });
  if (below >= 2 || (below >= 1 && prevBelow)) {
    return { kind: 'down', weight: top > 0 ? fromD(roundTo(topD * 0.925, step)) : 0, reps: p.repMin,
      why: (below >= 2 ? 'Reps well below the range' : 'Below the range two sessions running') + ' (' + repsList + '). Drop about 5–10% and rebuild.' };
  }
  if (below >= 1) return { kind: 'hold', weight: top, reps: prev.repMin, why: 'Just below the range (' + repsList + '). Keep the load and reach ' + prev.repMin + ' on every set.' };
  return { kind: 'hold', weight: top, reps: Math.min(prev.repMax, minR + 1), why: 'In the range (' + repsList + '). Keep the load and add a rep to your weakest set.' };
}
function nextTargetTxt(g, p) {
  if (g.kind === 'new') return 'Next target: pick a load × ' + rangeTxt(p.repMin, p.repMax, p.perSide);
  return 'Next target: ' + wl(g.weight, p.bodyweight) + ' × ' + g.reps + (p.perSide ? '/side' : '');
}
function planFromEx(e, week) {
  var t = target(e, week);
  return { id: e.id, repMin: e.repMin, repMax: e.repMax, perSide: e.perSide, bodyweight: e.bodyweight, increment: e.increment, rir: t.rir, deload: t.deload };
}
function planFromEntry(en, s) {
  var f = findEx(en.exId);
  return { id: en.exId, repMin: en.repMin, repMax: en.repMax, perSide: en.perSide, bodyweight: en.bodyweight,
    increment: f ? f.ex.increment : null, rir: en.targetRir, deload: s.week >= 5 };
}

/* ---------- PRs ---------- */
function bests(exId, excludeId) {
  var b = { maxW: 0, maxWset: null, maxE: 0, maxEset: null };
  sessions.forEach(function (s) {
    if (s.id === excludeId) return;
    s.entries.forEach(function (en) {
      if (en.exId !== exId) return;
      en.sets.forEach(function (st) {
        if (!isWork(st) || !st.w) return;
        if (st.w > b.maxW || (st.w === b.maxW && b.maxWset && st.r > b.maxWset.r)) { b.maxW = st.w; b.maxWset = { w: st.w, r: st.r, date: s.date }; }

        if (e > b.maxE) { b.maxE = e; b.maxEset = { w: st.w, r: st.r, date: s.date }; }
      });
    });
  });
  return b;
}
function prKind(st, b) {
  if (!isWork(st) || !st.w || !b.maxW) return null;
  var heavier = st.w > b.maxW + 1e-6, better = e1rm(st.w, st.r) > b.maxE + 0.01;

/* ---------- e1RM trend ---------- */
function e1Trend(exId, currentEntry, excludeId) {

  else { cur = L[0] ? bestE(L[0].entry) : 0; prev = L[1] ? bestE(L[1].entry) : null; }
  if (!cur) return null;

/* ---------- Deload detector ---------- */

  var L = lastEntries(exId, 3, excludeId);
  if (L.length < 3) return null;
  var es = L.map(function (x) { return bestE(x.entry); }); // [newest, middle, oldest]
  if (es[2] > 0 && es[0] < es[1] && es[1] < es[2]) return 'e1RM has dropped three sessions in a row';
  var hard = L.every(function (x) {

    return r.length && r.every(function (s) { return s.rir <= 1; });

}

}

/* ---------- Adherence ---------- */
function adherence() {
  var comp = completedSessions(), today = isoDate(), res = { streak: 0, month: 0, week: 0 };
  if (!comp.length) return res;
  var m = today.slice(0, 7), ws = weekStartISO(today);
  comp.forEach(function (s) { if (s.date.slice(0, 7) === m) res.month++; if (weekStartISO(s.date) === ws) res.week++; });
  if (daysBetween(comp[comp.length - 1].date, today) > STREAK_GAP_DAYS) return res;
  res.streak = 1;
  for (var i = comp.length - 1; i > 0; i--) {
    if (daysBetween(comp[i - 1].date, comp[i].date) <= STREAK_GAP_DAYS) res.streak++; else break;

}

/* ---------- Plates & warm-ups ---------- */
function plateBreakdown(total, unit) {
  var bar = BAR[unit];

  var side = (total - bar) / 2, rem = side, out = [];
  PLATES[unit].forEach(function (p) { while (rem >= p - 1e-9) { out.push(p); rem -= p; } });
  rem = Math.round(rem * 1000) / 1000;

}
function plateHtml(total, unit) {

  if (r.below) return '<p class="small">Below the empty bar (' + r.bar + ' ' + unit + ').</p>';
  var chips = '<span class="plate bar">bar</span>' + r.side.map(function (p) {
    var cls = 'p' + String(p).replace('.', '_') + (unit === 'lb' && p === 25 ? 'lb' : '');
    if (unit === 'kg' && p === 25) cls = 'p25';
    return '<span class="plate ' + cls + '">' + p + '</span>';
  }).join('');
  var txt = r.side.length ? 'Per side: ' + r.side.join(' + ') + ' ' + unit : 'Empty bar only';
  var warn = r.ok ? '' : '<p class="small" style="color:var(--red);margin:6px 0 0">Cannot make exact weight. Closest: ' + r.made + ' ' + unit + '.</p>';
  return '<p class="small num" style="margin:0">' + txt + ' (bar ' + r.bar + ' ' + unit + ')</p><div class="plate-list" aria-hidden="true">' + chips + '</div>' + warn;
}

  RAMP.forEach(function (x) {
    var d = roundTo(toD(workKg) * x[0], step);
    if (d <= 0 || seen[d]) return;
    seen[d] = 1;
    out.push({ w: fromD(d), r: x[1], rir: null, warm: true, done: false });
  });
  return out;
}

/* ================= Photos (IndexedDB) ================= */
var photoCache = {};
var dbReady = new Promise(function (res) {
  try {
    if (!window.indexedDB) return res(null);
    var r = indexedDB.open('ut_tracker_v1_photos', 1);
    r.onupgradeneeded = function () {
      var st = r.result.createObjectStore('photos', { keyPath: 'id' });
      st.createIndex('sessionId', 'sessionId', { unique: false });
    };
    r.onsuccess = function () { res(r.result); };
    r.onerror = function () { res(null); };
    r.onblocked = function () { res(null); };
  } catch (e) { res(null); }
});
function idb(mode, fn) {
  return dbReady.then(function (db) {
    if (!db) throw new Error('Photos are not available in this browser');
    return new Promise(function (res, rej) {
      var tx = db.transaction('photos', mode), req = fn(tx.objectStore('photos'));
      tx.oncomplete = function () { res(req && 'result' in req ? req.result : undefined); };
      tx.onerror = function () { rej(tx.error); };
      tx.onabort = function () { rej(tx.error); };

}
function photoId(sid, exId) { return sid + '|' + exId; }
function putPhoto(rec) { photoCache[rec.id] = rec.dataUrl; return idb('readwrite', function (st) { return st.put(rec); }); }
function getPhoto(id) {
  if (photoCache[id]) return Promise.resolve(photoCache[id]);
  return idb('readonly', function (st) { return st.get(id); }).then(function (rec) { if (rec) photoCache[id] = rec.dataUrl; return rec ? rec.dataUrl : null; });
}
function delPhoto(id) { delete photoCache[id]; return idb('readwrite', function (st) { return st.delete(id); }).catch(function () {}); }
function delSessionPhotos(sid) {
  Object.keys(photoCache).forEach(function (k) { if (k.indexOf(sid + '|') === 0) delete photoCache[k]; });
  return idb('readwrite', function (st) {
    var cur = st.index('sessionId').openCursor(IDBKeyRange.only(sid));
    cur.onsuccess = function () { var c = cur.result; if (c) { c.delete(); c.continue(); } };
    return cur;

}
function clearPhotos() { photoCache = {}; return idb('readwrite', function (st) { return st.clear(); }).catch(function () {}); }
function fileToDataUrl(file) {
  return new Promise(function (res, rej) {
    var fr = new FileReader();
    fr.onerror = function () { rej(fr.error); };
    fr.onload = function () {
      var img = new Image();
      img.onload = function () {
        try {
          var max = 1280, sc = Math.min(1, max / Math.max(img.width, img.height));
          var c = document.createElement('canvas');

/* ================= Charts (canvas) ================= */
function colors() {

}
function drawCharts() {
  if (!ui.chart) return;
  var lc = $('#line-chart'); if (lc && ui.chart.series && ui.chart.series.length) drawLine(lc, ui.chart.series);
  var bc = $('#bar-chart'); if (bc && ui.chart.bars) drawBars(bc, ui.chart.bars);
}

  ctx.setLineDash([]); ctx.fillStyle = color;
  xy.forEach(function (p) { ctx.beginPath(); ctx.arc(p[0], p[1], dashed ? 2.5 : 4, 0, Math.PI * 2); ctx.fill(); });
  ctx.restore();
}

exForm.addEventListener('click', function (ev) {
  var b = ev.target.closest('[data-dlg]'); if (!b) return;
  if (b.dataset.dlg === 'cancel') return closeDlg(exDlg);
  if (b.dataset.dlg === 'delete' && editing && editing.exId) {
    if (!confirm('Delete this exercise from the program? Its logged history stays.')) return;
    var day = findDay(editing.dayId);
    day.exercises = day.exercises.filter(function (x) { return x.id !== editing.exId; });
    saveProgram(); closeDlg(exDlg); render(); toast('Exercise deleted');
  }
});
function openDayDialog(dayId) {
  var d = findDay(dayId); if (!d) return;
  editing = { dayId: dayId };
  DF('name').value = d.name; DF('focus').value = d.focus || ''; DF('weekday').value = d.weekday || ''; DF('region').value = d.region || 'upper';
  showDlg(dayDlg); DF('name').focus();
}
dayForm.addEventListener('submit', function (ev) {
  ev.preventDefault();
  var d = findDay(editing.dayId), name = DF('name').value.trim();
  if (!name) { DF('name').focus(); return; }
  d.name = name; d.focus = DF('focus').value.trim(); d.weekday = DF('weekday').value.trim(); d.region = DF('region').value;
  saveProgram(); closeDlg(dayDlg); render(); toast('Day saved');
});
dayForm.addEventListener('click', function (ev) { if (ev.target.closest('[data-dlg="cancel"]')) closeDlg(dayDlg); });

/* ================= Export / import ================= */
function exportData() {
  flush();
  var data = { app: 'ut_tracker', version: 1, schema: SCHEMA, exportedAt: new Date().toISOString(), program: program, sessions: sessions, settings: settings, templates: templates };
  try {
    var blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    var url = URL.createObjectURL(blob), a = document.createElement('a');
    a.href = url; a.download = 'training-tracker-' + isoDate() + '.json';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 1500);
    toast('Backup exported (photos not included)');
  } catch (e) { toast('Export failed in this browser'); }
}
$('#import-file').addEventListener('change', function (ev) {
  var file = ev.target.files && ev.target.files[0]; if (!file) return;
  var reader = new FileReader();
  reader.onload = function () {
    var data;
    try { data = JSON.parse(reader.result); } catch (e) { toast('That file is not valid JSON'); return; }
    if (!data || data.app !== 'ut_tracker' || !validProgram(data.program) || !Array.isArray(data.sessions)) { toast('That file is not a tracker backup'); return; }
    if (!confirm('Replace your current program, sessions, templates and settings with this backup (' + data.sessions.length + ' sessions)? Photos on this device are kept.')) return;
    program = data.program;
    sessions = data.sessions.map(normalizeSession).filter(Boolean);
    settings = Object.assign(defaultSettings(), data.settings || {});
    templates = Array.isArray(data.templates) ? data.templates : [];
    migrate(true); // brings v1 backups up to schema 2
    ui.justCompleted = null; ui.volWeek = null; ui.progressEx = null; ui.selectedDay = null;
    render(); toast('Backup imported');
  };
  reader.onerror = function () { toast('Could not read that file'); };
  reader.readAsText(file);
  ev.target.value = '';
});

/* ================= Boot ================= */
function nextDayId() {
  var comp = completedSessions();
  if (!comp.length) return program.days[0].id;
  var idx = program.days.findIndex(function (d) { return d.id === comp[comp.length - 1].dayId; });
  return program.days[(idx + 1) % program.days.length].id;
}
var migrated = migrate(false);
if (!storedSettings) saveSettings();
render();
if (migrated && sessions.length) toast('Data updated to the new version. ' + sessions.length + ' sessions kept.');
})();
</script>
